[package]
name = "echomind"
version = "0.2.14"
description = "EchoMind - Hardware-Aware Hybrid AI Meeting Assistant"
authors = ["EchoMind Team"]
edition = "2021"

[lib]
name = "echomind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "echomind"
path = "src/main.rs"

[[example]]
name = "live_meeting_stress_tester"
path = "examples/live_meeting_stress_tester.rs"

[[example]]
name = "qa_print_import"
path = "examples/qa_print_import.rs"

[[example]]
name = "embed_bench"
path = "examples/embed_bench.rs"

[[example]]
name = "onnx_probe"
path = "examples/onnx_probe.rs"

[[example]]
name = "apple_dictation_check"
path = "examples/apple_dictation_check.rs"

[[example]]
name = "diarization_eval"
path = "examples/diarization_eval.rs"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

# Swift bridge for Core Audio process taps — only needed when building for macOS.
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[dependencies]
tauri = { version = "2.2.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "6"
sha2 = "0.10"
tract-onnx = "0.21"
sysinfo = "0.31.4"
cpal = "0.15"
ringbuf = "0.4"
hound = "3.5"
chrono = "0.4"
flacenc = "0.4"
symphonia = { version = "0.5", features = ["all"] }
rfd = "0.15"
rodio = "0.19"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
regex = "1.10"
urlencoding = "2.1"
chacha20poly1305 = "0.10"
# keyring 3.x has NO default features: without an explicit platform backend it
# silently uses an in-memory mock store that dies with the process. That caused
# every-launch key rotation and permanent data-at-rest / vault decrypt failure.
# Enable one real backend per OS (irrelevant features are ignored on other targets).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
swift-rs = "1.0"
whisper-rs = { version = "0.16.0", features = ["metal"] }
llama-cpp-2 = { version = "=0.1.158", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }
llama-cpp-2 = { version = "=0.1.158" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_SystemInformation", "Win32_Graphics_Direct3D11", "Win32_Foundation", "Win32_Media_Speech", "Win32_System_Com"] }

[[example]]
name = "qa_listen_20x"
path = "examples/qa_listen_20x.rs"

[[example]]
name = "transcript_dump"
path = "examples/transcript_dump.rs"

# One ggml in the app: whisper.cpp is built against llama.cpp's ggml (see
# crates/whisper-rs-sys/build.rs). Two ggml copies silently break both.
[patch.crates-io]
whisper-rs-sys = { path = "crates/whisper-rs-sys" }

[[example]]
name = "llm_report_check"
path = "examples/llm_report_check.rs"
