[package]
name = "echomind"
version = "0.1.0"
description = "EchoMind - Hardware-Aware Hybrid AI Meeting Assistant"
authors = ["EchoMind Team"]
edition = "2021"

[lib]
name = "echomind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31.4"
cpal = "0.15"
ringbuf = "0.4"
hound = "3.5"
chrono = "0.4"
flacenc = "0.4"
symphonia = { version = "0.5", features = ["all"] }
rfd = "0.15"
rodio = "0.19"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
regex = "1.10"
urlencoding = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_SystemInformation", "Win32_Graphics_Direct3D11"] }
