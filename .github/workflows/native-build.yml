name: Native Build (macOS / Windows)

# Compiles and links the app (whisper.cpp + llama.cpp sharing one ggml, the
# Swift bridge on macOS) on the platforms the main CI does not cover, so a
# link or toolchain break shows up in the PR instead of at release time.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & link (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ggml's Vulkan backend (Whisper on the GPU) needs the SDK to build.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -s -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
          # The Visual Studio generator runs the steps of ggml's shader
          # generator (an ExternalProject) out of order; Ninja does not.
          choco install ninja -y --no-progress
          Add-Content $env:GITHUB_ENV "CMAKE_GENERATOR=Ninja"
          # The shader generator's nested CMake build dirs pass Windows' 260
          # character path limit under the default target dir.
          Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=C:\t"
          # cmake-rs replaces CMake's default C++ flags, dropping /EHsc; ggml's
          # Vulkan backend reports failures (no driver, out of memory) with
          # exceptions.
          Add-Content $env:GITHUB_ENV "CXXFLAGS=/EHsc"

      # Ninja needs the MSVC compiler on PATH.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and link the app and its tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      # Lists ggml's devices for real. The runner has no GPU and normally no
      # Vulkan driver, so on Windows this goes through the vulkan-1.dll
      # delay-load hook; a crash here means the app would not start there.
      - name: Start ggml without a GPU
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ls -la /c/Windows/System32/vulkan-1.dll || echo "no vulkan-1.dll in System32"; fi
          cargo test --manifest-path src-tauri/Cargo.toml --lib ggml_devices -- --nocapture
