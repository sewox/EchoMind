name: EchoMind CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Dependencies for Tauri & Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev

      - name: Install NPM Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run typecheck

      - name: Lint Check (ESLint)
        run: npm run lint

      - name: Unit & Integration Tests with Coverage (Vitest - Stop on Failure)
        run: npm run test:coverage

      - name: Backend Rust Unit Tests (Cargo)
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose
